<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B4F">
<title>Try InvestEd in your browser</title>
<meta name="description" content="Play InvestEd's personal-finance lessons and a $10,000 practice stock market right in your browser.">
<link rel="icon" href="../icon.png">
<style>
:root{
  --paper:#F3EEE4;--card:#FFFCF5;--sunken:#EAE3D6;--line:#E2D9C8;--ink:#1F1C17;--muted:#6E665A;--onink:#FFF8EA;
  --green:#1E7350;--petrol:#1F5F7A;--gold:#D49A1E;--streak:#D2572B;--red:#BF3B2B;
  --learn:#1E6B4F;--market:#1F5F7A;--shop:#A86F14;--friends:#B04530;--profile:#33403F;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--paper:#121110;--card:#1D1B17;--sunken:#26231E;--line:#302C25;--ink:#F3EEE4;--muted:#A69E90}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E4DCCB;color:var(--ink);font:16px/1.4 var(--sans);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){body{background:#0A0908}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the app column */
.shell{position:relative;max-width:440px;min-height:100%;margin:0 auto;background:var(--paper);overflow-x:hidden}
@media (min-width:600px){.shell{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 20px 60px rgba(0,0,0,.18)}}
#app{min-height:100vh;padding-bottom:120px}
#app.full{padding-bottom:0}

/* tab header: solid ink + guilloche, content tucks into its bottom edge */
.hdr{position:relative;background:var(--tab);color:var(--onink);padding:22px 20px 50px;overflow:hidden}
.hdr .guil{position:absolute;left:0;right:0;bottom:0;width:100%;height:260px;pointer-events:none}
.hdr .guil path{stroke:var(--onink);stroke-opacity:.09;stroke-width:1;fill:none}
.hdr-top{position:relative;display:flex;align-items:flex-start;gap:12px}
.hdr h1{font:700 34px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.hdr .tag{margin:4px 0 0;font-size:15px;font-weight:500;opacity:.8}
.avatar{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--onink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
.avatar img{width:38px;height:38px}
.tip{position:relative;margin-top:14px;background:rgba(255,248,234,.14);border:1px solid rgba(255,248,234,.22);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.tip b{font-weight:700}
.hero{position:relative;margin-top:18px}
.kicker{font:800 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.hdr .kicker{opacity:.78}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.chips.two{grid-template-columns:1fr 1fr}
.chip{background:rgba(255,248,234,.13);border:1px solid rgba(255,248,234,.16);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:7px;min-width:0}
.chip .i{font-size:15px}
.chip b{display:block;font-size:15px;line-height:1.1}
.chip small{display:block;font-size:11px;opacity:.75;white-space:nowrap}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F2C75C,#D49A1E 60%,#A9760F);box-shadow:inset 0 0 0 1.5px rgba(120,80,0,.35);flex:none}
.unitline{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.unitline span{opacity:.8;font-weight:500}
.track{height:5px;border-radius:3px;background:rgba(255,248,234,.22);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--onink);border-radius:3px}
.content{position:relative;margin-top:-26px;padding:0 16px;display:flex;flex-direction:column;gap:18px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sec{margin:6px 4px -8px;color:var(--muted)}

/* learn: unit card + path */
.unit{background:var(--u);color:var(--onink);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.unit .kicker{opacity:.8}
.unit h2{font:700 22px/1.15 var(--serif);margin:6px 0 4px}
.unit p{margin:0;font-size:14px;opacity:.85}
.unit .track{width:100%}
.unit .meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;opacity:.85}
.unit .meta .track{margin:0;flex:0 0 90px}
.unit .pig{width:62px;height:62px;border-radius:50%;background:var(--onink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 5px rgba(255,248,234,.18)}
.unit .pig img{width:48px}
.path{position:relative;height:var(--h);margin:4px 0 10px}
.path svg.line{position:absolute;top:0;left:50%;margin-left:-200px;overflow:visible}
.path svg.line path{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-dasharray:.1 11}
.node{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;width:150px}
.node .disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:28px;position:relative;transition:transform .12s}
.node:active .disc{transform:scale(.94)}
.node .label{margin-top:7px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.node.done .disc{background:var(--gold);color:#5A3D00;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.node.done .disc .i{stroke-width:3}
.node.cur .disc{background:var(--u);color:var(--onink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 0 0 6px var(--paper),0 0 0 10px color-mix(in srgb,var(--u) 30%,transparent)}
.node.cur .disc::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--u);opacity:.5;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.node.cur .disc::after{animation:none;opacity:.35}}
.node.cur .label{color:var(--ink)}
.node .start{position:absolute;top:-34px;background:var(--u);color:var(--onink);font:800 11px/1 var(--sans);letter-spacing:.06em;padding:7px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.node .start::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--u)}
.node.next .disc{background:var(--sunken);color:var(--muted);box-shadow:inset 0 -5px 0 rgba(0,0,0,.06)}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:8px 20px 0;line-height:1.5}
.foot a{color:var(--green);font-weight:600}

/* floating tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(408px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:30px;box-shadow:0 8px 28px rgba(0,0,0,.14);display:flex;justify-content:space-around;padding:7px 6px;z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);width:20%}
.tabbar .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.tabbar button.on{color:var(--c)}
.tabbar button.on .ic{background:var(--c);color:var(--onink)}
.tabbar button.soon{opacity:.55}
.hidden{display:none!important}

/* lesson player */
.lesson{min-height:100vh;display:flex;flex-direction:column;padding:16px 18px 0}
.ltop{display:flex;align-items:center;gap:12px}
.ltop .x{font-size:22px;color:var(--muted);padding:4px}
.lbar{flex:1;height:12px;border-radius:6px;background:var(--sunken);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .35s;box-shadow:inset 0 3px 0 rgba(255,255,255,.22)}
.hearts{display:flex;gap:3px;color:var(--red);font-size:17px}
.hearts .lost{color:var(--line)}
.hearts.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qtitle{font:700 25px/1.22 var(--serif);margin:26px 0 6px}
.qsub{color:var(--muted);font-size:15px;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;font-size:17px;box-shadow:0 2px 0 var(--line);transition:border-color .12s,background .12s}
.opt .mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;flex:none}
.opt.box .mark{border-radius:7px}
.opt.sel{border-color:var(--petrol);background:color-mix(in srgb,var(--petrol) 9%,var(--card));box-shadow:0 2px 0 color-mix(in srgb,var(--petrol) 45%,transparent)}
.opt.sel .mark{background:var(--petrol);border-color:var(--petrol);color:#fff}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}
.opt.right .mark{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.opt.wrong .mark{background:var(--red);border-color:var(--red);color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600;padding:22px 10px}
.tf .opt .mark{display:none}
.numbox{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;font:700 34px/1 var(--serif)}
.numbox:focus-within{border-color:var(--petrol)}
.numbox input{font:inherit;width:1.2em;max-width:260px;border:0;background:none;color:var(--ink);outline:none;text-align:center}
.numbox.right{border-color:var(--green)}.numbox.wrong{border-color:var(--red)}
.spacer{flex:1;min-height:24px}
.cta{position:sticky;bottom:0;padding:14px 0 max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.btn{display:block;width:100%;height:54px;border-radius:14px;background:var(--b,var(--green));color:var(--onink);font-weight:700;font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.42;box-shadow:none}
.btn.ghost{background:none;color:var(--muted);box-shadow:none;height:44px;font-weight:600}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:440px;padding:18px 18px max(18px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0;transition:transform .28s cubic-bezier(.2,.9,.3,1.1);z-index:30}
.sheet.show{transform:translate(-50%,0)}
.sheet.good{background:color-mix(in srgb,var(--green) 16%,var(--card));--b:var(--green)}
.sheet.bad{background:color-mix(in srgb,var(--red) 13%,var(--card));--b:var(--red)}
.sheet h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:700 22px var(--serif)}
.sheet.good h3{color:var(--green)}.sheet.bad h3{color:var(--red)}
.sheet h3 .badge{width:30px;height:30px;border-radius:50%;background:currentColor;display:grid;place-items:center;font-size:17px}
.sheet h3 .badge .i{stroke:#fff;stroke-width:3}
.sheet p{margin:0 0 16px;font-size:15px;line-height:1.45}

/* result screens */
.result{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px 0}
.result .bigpig{width:130px;height:130px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 0 10px color-mix(in srgb,var(--gold) 18%,transparent);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.result .bigpig img{width:100px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.result h2{font:700 30px/1.15 var(--serif);margin:26px 0 6px}
.result p{color:var(--muted);margin:0}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0 0}
.pill{border-radius:14px;padding:12px 14px;min-width:96px;border:1.5px solid var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--card))}
.pill small{display:block;font:800 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--pc)}
.pill b{display:flex;align-items:center;justify-content:center;gap:6px;font:700 22px/1 var(--serif);margin-top:8px}
.levelup{margin-top:18px;background:var(--gold);color:#4A3200;font-weight:700;border-radius:999px;padding:8px 16px}
.result .cta{width:100%}

/* market */
.big{font:700 44px/1 var(--serif);margin:8px 0 10px;letter-spacing:-.01em}
.chg{display:inline-flex;align-items:center;gap:5px;background:rgba(255,248,234,.14);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
.search{display:flex;align-items:center;gap:10px;padding:13px 14px;box-shadow:0 6px 18px rgba(0,0,0,.08);color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0}
.list .row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.list .row+.row{border-top:1px solid var(--line)}
.row .sym{display:block;font-weight:700;font-size:16px}
.row .nm{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l{flex:1;min-width:0}
.row .r{text-align:right}
.row .px{font-weight:700}
.up{color:var(--green)}.down{color:var(--red)}
.row .r small{display:block;font-size:13px;font-weight:600}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:800 10.5px var(--sans);letter-spacing:-.02em;color:var(--onink);flex:none}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.note{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
.note button{color:var(--muted);text-decoration:underline}

/* trade sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.trade{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:440px;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px max(20px,env(safe-area-inset-bottom));transition:transform .28s cubic-bezier(.2,.9,.3,1.05);z-index:41}
.trade.show{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.trade .head{display:flex;align-items:center;gap:12px}
.trade .head h3{margin:0;font:700 24px var(--serif)}
.trade .head .x{margin-left:auto;font-size:22px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:12px;padding:3px;margin:16px 0}
.seg button{height:38px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--sunken);font-size:20px;display:grid;place-items:center}
.stepper input{width:110px;text-align:center;font:700 30px var(--serif);border:0;background:none;color:var(--ink);outline:none}
.kv{display:flex;justify-content:space-between;padding:12px 4px 0;font-size:15px;color:var(--muted)}
.kv b{color:var(--ink)}
.trade .btn{margin-top:16px}

.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .3s;z-index:60;max-width:90%}
.toast.show{transform:translate(-50%,0)}
</style></head><body>
<div class="shell">
  <div id="app"></div>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
</div>
<script src="lessons.js"></script>
<script src="play.js"></script>
</body></html>
