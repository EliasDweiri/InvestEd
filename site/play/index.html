<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Try InvestEd in your browser</title>
<meta name="description" content="Play InvestEd's personal-finance lessons and a $10,000 practice stock market right in your browser.">
<link rel="icon" href="../icon.png">
<style>
:root{--bg:#F3EEE4;--card:#FFFCF5;--ink:#1F1C17;--muted:#6E665A;--line:#E2D9C8;--green:#1E7350;--brick:#A4442F;--onink:#FFF8EA}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--card:#1D1B17;--ink:#F3EEE4;--muted:#A69E90;--line:#302C25;--green:#3E9A72;--brick:#D0705A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#1E7350;color:var(--onink);padding:14px 16px}
header .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:34px;height:34px;border-radius:9px}
header a{color:var(--onink);text-decoration:none;font:700 20px/1 ui-serif,Georgia,serif}
header .stat{margin-left:auto;font-weight:600;font-size:15px;background:rgba(255,248,234,.16);border:1px solid rgba(255,248,234,.35);border-radius:999px;padding:4px 12px}
main{max-width:560px;margin:12px auto 40px;padding:0 16px}
h1,h2{font-family:ui-serif,Georgia,serif;line-height:1.25}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:4px 0 8px}
.intro p{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.unit{border-top:5px solid var(--u)}
.kicker{font:700 12px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.unit .kicker{color:var(--u)}
.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;width:100%;text-align:left;margin:6px 0}
button:disabled{opacity:.5;cursor:default}
button.lesson{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.primary{background:var(--green);border-color:var(--green);color:var(--onink);text-align:center;font-weight:600;margin-top:12px}
button.selected{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
button.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card))}
button.wrong{border-color:var(--brick);background:color-mix(in srgb,var(--brick) 16%,var(--card))}
button.link{background:none;border:0;color:var(--muted);text-align:center;font-size:14px;text-decoration:underline}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:4px}
.tabs button{margin:0;text-align:center;border:0;font-weight:600;color:var(--muted);background:none}
.tabs button.on{background:var(--green);color:var(--onink)}
.qhead{display:flex;align-items:center;gap:12px;margin-top:8px}
.qhead .close{width:auto;margin:0;padding:6px 10px;border:0;background:none;color:var(--muted);font-size:18px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.prompt{font-size:21px}
.num{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600}
input[type=number]{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.feedback.good{background:color-mix(in srgb,var(--green) 14%,var(--card))}
.feedback.bad{background:color-mix(in srgb,var(--brick) 14%,var(--card))}
.big{font:700 40px/1.1 ui-serif,Georgia,serif;margin:6px 0}
.summary .row{display:flex;gap:24px;margin-top:8px;font-size:15px}
.up{color:var(--green)}.down{color:var(--brick)}
.stock{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.right-col{text-align:right}
.trade{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.trade input{width:80px;padding:8px 10px}
.trade button{width:auto;margin:0;padding:8px 16px;text-align:center}
.trade .buy{background:var(--green);border-color:var(--green);color:var(--onink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 32px}
footer a{color:var(--green)}
</style></head><body>
<header><div class="in"><img src="../icon.png" alt=""><a href="../index.html">InvestEd</a><span class="stat" id="xp">0 XP</span></div></header>
<main><div id="app"></div></main>
<footer>A browser demo of the InvestEd iPhone app. All investing is simulated. Not financial advice.<br><a href="https://github.com/EliasDweiri/InvestEd">Source on GitHub</a></footer>
<script src="lessons.js"></script>
<script src="play.js"></script>
</body></html>
